# GitHub App Configuration for hasit.in
# This file configures the GitHub App behavior for this repository

# App metadata
name: "hasit.in Automation"
description: "Automated workflows and checks for hasit.in unified Worker"

# Permissions required by the app
permissions:
  contents: read
  checks: write
  pull_requests: write
  issues: write
  deployments: write
  statuses: write
  metadata: read

# Events the app subscribes to
events:
  - pull_request
  - push
  - workflow_run
  - check_run
  - check_suite
  - deployment
  - deployment_status

# Default branch protection (enforced via branch protection rules)
# This is documentation; actual rules are set in repository settings
branch_protection:
  main:
    required_status_checks:
      strict: true
      contexts:
        - "PR Gate (typecheck, test, deploy:dry)"
    enforce_admins: false
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
    restrictions:
      users: []
      teams: []

# Automated workflows
workflows:
  - name: "PR Gate"
    file: ".github/workflows/pr-gate.yml"
    triggers:
      - pull_request
    required: true

  - name: "Deploy Worker"
    file: ".github/workflows/deploy.yml"
    triggers:
      - push: [main]
      - workflow_dispatch
    required: false

# Dependabot configuration (see .github/dependabot.yml)
dependabot:
  enabled: true
  config_file: ".github/dependabot.yml"

# Security
security:
  # Enable secret scanning alerts
  secret_scanning: true
  # Enable dependency vulnerability alerts
  dependabot_alerts: true
  # Enable code scanning (if configured)
  code_scanning: false

# Labels for issue/PR management
labels:
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "security"
    color: "ee0701"
    description: "Security related"
  - name: "dependencies"
    color: "0366d6"
    description: "Dependency updates"
  - name: "ci/cd"
    color: "1d76db"
    description: "CI/CD pipeline changes"

# Auto-merge configuration
automerge:
  enabled: false  # Set to true to enable auto-merge for passing PRs
  allowed_labels: []
  blocked_labels: ["do-not-merge", "security"]

# Release configuration
releases:
  enabled: false
  tag_prefix: "v"
  target_branch: "main"

# Notification settings
notifications:
  on_failure:
    - type: "github_check"
      workflow: "PR Gate"
    - type: "github_check"
      workflow: "Deploy Worker"
  on_success: []