name = "hasit-in"
main = "src/index.ts"
compatibility_date = "2026-05-03"

# One Worker, every subdomain. custom_domain provisions DNS and TLS.
# interview.hasit.in remains on its separate Cloudflare Pages SSR deployment.
routes = [
  { pattern = "hasit.in", custom_domain = true },
  { pattern = "www.hasit.in", custom_domain = true },
  { pattern = "trx2.hasit.in", custom_domain = true },
  # trx.hasit.in is intentionally absent: being reverted to its previous hosting.
  { pattern = "freellm.hasit.in", custom_domain = true },
  { pattern = "fitness.hasit.in", custom_domain = true },
  { pattern = "finance.hasit.in", custom_domain = true },
  # blog.hasit.in is intentionally absent: hosted on a separate VPS.
  { pattern = "quiz.hasit.in", custom_domain = true },
  { pattern = "games.hasit.in", custom_domain = true },
  { pattern = "auth.hasit.in", custom_domain = true },
]

# Static assets are served by Cloudflare directly, without invoking the Worker.
# Requests to them are free and unlimited and do not count against the
# Workers request quota.
[assets]
directory = "./public"
binding = "ASSETS"

# html_handling MUST be "none". The Worker rewrites clean browser URLs to
# staged shells such as /_spa/freellm/index.html, then calls ASSETS.fetch().
# The default ("auto-trailing-slash") answers any .../index.html asset fetch
# with a 307 to the directory URL, so every SPA host redirected to the private
# /_spa/ path and rendered nothing. With "none" the file is served directly.
# Consequence: /books/x (no extension) no longer resolves to /books/x.html.
# Every link and the sitemap use the .html URL, so nothing depends on it.
html_handling = "none"

# Asset misses return 404 and fall through to the Worker's fetch() handler,
# which owns SPA routing. Never "single-page-application": that would answer
# misses with an app shell before the Worker can pick the right app.
not_found_handling = "none"

# /_spa/* and /apps/* must reach the Worker so isPrivatePath() can 404 them.
# Without these entries the asset layer serves the staged build output
# directly, exposing the private prefix the Worker rewrites to.
# /quiz/* must reach the Worker because the quiz zone URL rewrite sends
# quiz.hasit.in/* to hasit.in/quiz/*; the Worker recovers the app from the
# prefix (see resolvePathMount).
run_worker_first = [
  "/",
  "/api/*",
  "/v1/*",
  "/health",
  "/auth/*",
  "/admin/*",
  "/_spa/*",
  "/apps/*",
  "/quiz/*",
]

[[d1_databases]]
binding = "DB"
database_name = "hasit-in"
database_id = "ea3f54ed-75e6-4a45-b7b9-d80509efe4e8"

[[durable_objects.bindings]]
name = "AUTH_STATE"
class_name = "AuthState"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[vars]
ENVIRONMENT = "production"
GA_ID = "G-NNFPYD7CWG"
ADSENSE_CLIENT = "ca-pub-7046934020222763"
TURNSTILE_SITE_KEY = "0x4AAAAAAGLkTZr2vBCLFfZJ"
GOOGLE_CLIENT_ID = "790517677532-hbolt3juspd1pqvenepc8708msss5hag.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://auth.hasit.in/callback"

# Secrets (set via: wrangler secret put SECRET_NAME)
# TURNSTILE_SECRET
# FAUCETPAY_API_KEY
# JWT_PRIVATE_KEY (ES256 PEM)
# JWT_PUBLIC_KEY (ES256 PEM)
# GOOGLE_CLIENT_SECRET
# FREELLM_API_KEY (for Quiz AI, Finance narratives, Games pinpoint)
# FREELLM_MODEL (default: gemini-2.5-flash)
# ENCRYPTION_KEY (FreeLLM key-vault encryption)
# RESEND_API_KEY (FreeLLM email verification)
# ADMIN_EMAIL, MAIL_FROM, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET (optional aliases for GOOGLE_CLIENT_ID/SECRET)
